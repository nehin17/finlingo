spring.application.name=backend

# Server
server.port=${PORT:8080}

# Database: set DATABASE_URL, DB_USERNAME and DB_PASSWORD in the deployment environment.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/finlingo}
spring.datasource.username=${DB_USERNAME:${FINLINGO_DB_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:${FINLINGO_DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Financial data provider
finnhub.api.key=${FINNHUB_API_KEY:}
finnhub.api.base-url=${FINNHUB_API_BASE_URL:https://finnhub.io/api/v1}

# JWT
jwt.secret=${JWT_SECRET:${FINLINGO_JWT_SECRET:}}
jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# Generative AI
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_API_MODEL:gemini-3.5-flash-lite}

# Comma-separated frontend origins, e.g. https://finlingo.example.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
